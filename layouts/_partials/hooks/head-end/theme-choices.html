
<script>
  // Only show the three personal theme packs in the existing HugoBlox picker.
  window.addEventListener('load', () => {
    const allowed = ['hanji', 'cafe', 'swimming'];
    const picker = document.querySelector('select[onchange*="data-theme-pack"]');
    if (!picker) return;

    for (const option of [...picker.options]) {
      if (!allowed.includes(option.value)) option.remove();
    }

    const labels = {
      hanji: 'Hanji',
      cafe: 'Café',
      swimming: 'Swimming'
    };

    for (const option of picker.options) {
      option.textContent = labels[option.value];
    }

    const saved = localStorage.getItem('hb-theme-pack');
    const selected = allowed.includes(saved) ? saved : 'hanji';

    picker.value = selected;
    document.documentElement.setAttribute('data-theme-pack', selected);
    localStorage.setItem('hb-theme-pack', selected);
  });
</script>
