hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Hanji"
    vendor: "custom"
    version: "1.0.0"
    description: "Traditional Korean paper aesthetic"

  type: "dual"

  light:
    colors:
      primary: "#415C52"
      secondary: "#9B5948"
      neutral: "#78716C"
    surfaces:
      background: "#F4EEDF"
      foreground: "#292D28"
      header:
        background: "#EAE1CF"
        foreground: "#292D28"
      footer:
        background: "#EAE1CF"
        foreground: "#514C43"

  dark:
    colors:
      primary: "#D0B57A"
      secondary: "#9BB8BD"
      neutral: "#858F98"
    surfaces:
      background: "#172433"
      foreground: "#E6DDC8"
      header:
        background: "#101B29"
        foreground: "#E9DFC7"
      footer:
        background: "#101B29"
        foreground: "#C4BDAC"
