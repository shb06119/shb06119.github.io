hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Hanji"
    vendor: "custom"
    version: "1.0.0"
    description: "Traditional Korean paper aesthetic"

  type: "dual"

  light:
    colors:
      primary: "#415C52"
      secondary: "#9B5948"
      neutral: "#78716C"
    surfaces:
      background: "#F4EEDF"
      foreground: "#292D28"
      header:
        background: "#EAE1CF"
        foreground: "#292D28"
      footer:
        background: "#EAE1CF"
        foreground: "#514C43"

dark:
  colors:
    primary: "#D0B57A"
    secondary: "#B89A6A"
    neutral: "#7E7A73"
  surfaces:
    background: "#111827"
    foreground: "#E7DEC9"
    header:
      background: "#0E1622"
      foreground: "#E7DEC9"
    footer:
      background: "#0E1622"
      foreground: "#C8BEAA"
