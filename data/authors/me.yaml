bio: |
  I am currently a visiting research student at King Abdullah University of Science and Technology (KAUST), 
  working with Prof. Håvard Rue's research group. My research interests lie in Bayesian statistics and statistical computation, 
  particularly scalable Bayesian inference, latent Gaussian models, and stochastic processes. 
  I am also interested in the artificial intelligence. I received my M.S. in Mathematics from KAIST in August 2026 
  and my B.S. in Statistics from Hankuk University of Foreign Studies (HUFS). 
  My master's research focused on Bayesian hierarchical modeling and small-area estimation.

